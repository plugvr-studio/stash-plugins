name: Pair QR
description: Show a QR code that connects PlugVR, the VR player for Stash on Meta Quest 3 and 3S (plugvr.app), to this server. The code holds the Stash URL and API key (no key when Stash has no login). Its text can be edited, with placeholders for the URL, key and server name. It warns when Stash is open at localhost. Pair QR is in Settings -> Security. Requires Stash v0.27.0 or later.
version: 1.3.2
url: https://github.com/plugvr-studio/stash-plugins/tree/main/plugins/pair-qr
ui:
  css:
    - pair-qr.css
  javascript:
    - qrcode.js
    - pair-qr.js
